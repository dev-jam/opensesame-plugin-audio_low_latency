[tool.poetry]
name = "opensesame-plugin-audio_low_latency"
version = "13.1.2"
description = "An OpenSesame Plug-in for playing and recording audio files with low latency"
authors = ["Bob Rosbag <debian@bobrosbag.nl>"]
readme = "README.md"
packages = [
    {include = "opensesame_plugins"},
]
license = "GPL-3.0-or-later"
homepage = "https://github.com/dev-jam/opensesame-plugin-audio_low_latency"
repository = "https://github.com/dev-jam/opensesame-plugin-audio_low_latency"

[tool.poetry.dependencies]
python = ">= 3.10"
sounddevice = ">= 0.5.1"
pygame = ">= 2.0.0"
pyalsaaudio = {version = ">= 0.11.0", platform = "linux"}

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
